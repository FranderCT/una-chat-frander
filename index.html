<!doctype html>
<html>
  <head>
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
      #barra { display: none; background: #222; color: #fff; padding: 8px 10px; }
      #barra a, #login a { color: rgb(130, 224, 255); margin-left: 10px; }
      #login { display: none; padding: 40px; text-align: center; font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="barra"><span id="usuario"></span><a id="salir" href="/auth/logout">Cerrar sesión</a></div>
    <div id="login">Inicie sesión para entrar a la sala. <a href="/auth/login">Iniciar sesión</a></div>
    <ul id="messages"></ul>
    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username" aria-label="Username"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Mensaje" /><button type="submit">Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>

    var colorHexTxt = "";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

      // con Auth0 activo: /sala responde 401 sin sesion; con sesion muestra el nombre y "Cerrar sesión"
      function iniciar() {
        var socket = io();

        // emite evento al servidor
        
        $('form').submit(function(){
            var nombreTxt = $('#nombre').val() || "Anomimo";
            var mensajeTxt = $('#m').val();

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            return false;
        });

        // ... (resto del código) ...

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);
            if (!msgJson.mensaje) { return; }
            // el servidor ya escapo nombre y mensaje (unalib.validateMessage); el color se revalida aqui
            var color = /^#[0-9a-f]{6}$/i.test(msgJson.color) ? msgJson.color : '#000000';
            var mensajeDisplay = "<b style='color:"+ color +"'>" + msgJson.nombre + "</b>: " + msgJson.mensaje;
            $('#messages').append($('<li>').html(mensajeDisplay));
            window.scrollTo(0, document.body.scrollHeight);
        });

      }

      $(function () {
        $.getJSON('/auth/config').done(function (cfg) {
          if (!cfg.enabled) { return iniciar(); }
          $.getJSON('/sala').done(function (u) {
            $('#usuario').text(u.name);
            $('#nombre').val(u.name);
            $('#barra').show();
            iniciar();
          }).fail(function () {
            $('form, #messages').hide();
            $('#login').show();
          });
        }).fail(function () { iniciar(); });
      });
    </script>
  </body>
</html>
